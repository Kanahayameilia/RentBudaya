<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RentBudaya - Daftar</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">

<style>
/* Tambahan style untuk pilihan role */
.role-group {
    display: flex;
    gap: 15px;
    margin: 10px 0 5px;
}

.role-option {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 16px;
    background: white;
    border: 2px solid #e0cfc2;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.role-option:hover {
    border-color: #C8593A;
    background: #FFF5EE;
}

.role-option.selected {
    background: #C8593A;
    border-color: #C8593A;
}

.role-option.selected label,
.role-option.selected small {
    color: white;
}

.role-option input[type="radio"] {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: #C8593A;
    cursor: pointer;
}

.role-option.selected input[type="radio"] {
    accent-color: white;
}

.role-option label {
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin: 0;
    color: #4B2E2B;
}

.role-option small {
    font-size: 11px;
    color: #8a7060;
    font-weight: normal;
}

.field small.hint {
    display: block;
    margin-top: 5px;
    font-size: 11px;
    color: #8a7060;
}

.card {
    max-width: 450px;
    padding: 40px 40px 45px;
    border-radius: 24px;
}

.card h1 {
    font-size: 30px;
    margin-bottom: 28px;
}

.btn-masuk {
    margin-top: 10px;
    padding: 14px;
    font-size: 16px;
}

@media (max-width: 480px) {
    .card {
        padding: 30px 25px;
        margin: 20px;
    }
    .role-group {
        flex-direction: column;
        gap: 10px;
    }
    .role-option {
        justify-content: flex-start;
    }
    .card h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="login-bg"></div>

<div class="card">
    <p class="brand">RentBudaya</p>
    <h1>Daftar Akun</h1>

    <form id="daftarForm">
        <div class="field">
            <label>Nama Lengkap</label>
            <input type="text" id="nama" placeholder="Masukkan nama lengkap..." required>
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email" id="email" placeholder="contoh: nama@email.com" required>
        </div>

        <div class="field">
            <label>Password</label>
            <input type="password" id="password" placeholder="Minimal 6 karakter" required>
            <small class="hint">⚠️ Gunakan minimal 6 karakter untuk keamanan</small>
        </div>

        <!-- PILIHAN ROLE -->
        <div class="field">
            <label>Daftar Sebagai</label>
            <div class="role-group">
                <div class="role-option customer selected" onclick="selectRole('customer')">
                    <input type="radio" name="role" id="role_customer" value="customer" checked> 
                    <label for="role_customer">👤 Customer</label>
                    <small>Penyewa</small>
                </div>
                <div class="role-option seller" onclick="selectRole('seller')">
                    <input type="radio" name="role" id="role_seller" value="seller"> 
                    <label for="role_seller">🏪 Penjual</label>
                    <small>Pemilik Toko</small>
                </div>
            </div>
        </div>

        <button type="submit" class="btn-masuk">Daftar Sekarang</button>
    </form>

    <p class="footer">
        Sudah punya akun? <a href="login.html">Masuk</a>
    </p>
</div>

<script>
// Function untuk toggle style role selection
function selectRole(role) {
    const customerDiv = document.querySelector('.role-option.customer');
    const sellerDiv = document.querySelector('.role-option.seller');
    const customerRadio = document.getElementById('role_customer');
    const sellerRadio = document.getElementById('role_seller');
    
    if (role === 'customer') {
        customerDiv.classList.add('selected');
        sellerDiv.classList.remove('selected');
        if (customerRadio) customerRadio.checked = true;
        if (sellerRadio) sellerRadio.checked = false;
    } else {
        sellerDiv.classList.add('selected');
        customerDiv.classList.remove('selected');
        if (sellerRadio) sellerRadio.checked = true;
        if (customerRadio) customerRadio.checked = false;
    }
}

// Form submit handler
document.getElementById("daftarForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    // Ambil nilai dari input
    const nama = document.getElementById("nama").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    
    // Ambil role dengan cara yang PASTI benar
    let role = "customer";
    const roleSeller = document.getElementById("role_seller");
    
    if (roleSeller && roleSeller.checked) {
        role = "seller";
    }

    // Validasi
    if (!nama) {
        alert("Mohon isi nama lengkap!");
        return;
    }
    if (!email || !password) {
        alert("Mohon isi email dan password!");
        return;
    }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
        alert("Format email tidak valid!");
        return;
    }

    if (password.length < 6) {
        alert("Password minimal 6 karakter!");
        return;
    }

    const submitBtn = document.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = "Memproses...";

    try {
        const response = await fetch("api/daftar.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nama: nama,
                email: email,
                password: password,
                role: role
            })
        });

        const result = await response.json();

        if (result.success) {
            if (role === 'seller') {
                alert("✅ Pendaftaran sebagai PENJUAL berhasil!\nSilakan login.");
                window.location.href = "login_penjual.html";
            } else {
                alert("✅ Pendaftaran sebagai CUSTOMER berhasil!\nSilakan login.");
                window.location.href = "login.html";
            }
        } else {
            alert("❌ Gagal: " + result.message);
        }

    } catch (error) {
        console.error("Error:", error);
        alert("❌ Terjadi kesalahan: " + error.message);
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
    }
});
</script>
<script src="daftar.js"></script>
</body>
</html>
