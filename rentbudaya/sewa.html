<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Sewa Produk</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sewa.css">
<link rel="stylesheet" href="dekorasi.css">

</head>

<body>

<header class="navbar">

<div class="logo">RB</div>

<div class="nav-right">

<a href="lihatproduk.html" class="back">‹ Kembali</a>

<div class="profile-dropdown">
<button class="profile-btn">👤 Profil Saya ▾</button>
<div class="profile-menu">
<a href="editprofil.html">Edit Profil</a>
<a href="#" class="logout">Logout</a>
</div>
</div>

</div>
</header>
<main class="container">
<div class="content-row">
<div class="photo-wrap">
<img src="Assets/image/imageproduk.jpeg" id="product-image">
</div>
<div class="detail-card">
<h2>Kebaya Beskap Solo</h2>

<p class="desc">
Kebaya Beludru dan Beskap Jawa bernuansa hitam emas.
Elegan, klasik, dan sangat cocok untuk acara pernikahan
atau prosesi adat formal.
</p>

<div class="divider"></div>
<div class="option-row">
<span class="option-label">Model</span>

<div class="tags" id="model-options">
<div class="tag active" onclick="selectModel(this, 'Pria')">Pria</div>
<div class="tag" onclick="selectModel(this, 'Wanita')">Wanita</div>
</div>
</div>


<div class="option-row">
<span class="option-label">Warna</span>

<div class="tags" id="color-options">
<div class="tag active" onclick="selectColor(this, 'Hitam')">Hitam</div>
<div class="tag" onclick="selectColor(this, 'Biru')">Biru</div>
<div class="tag" onclick="selectColor(this, 'Hijau')">Hijau</div>
</div>
</div>


<div class="durasi-section">
<span class="option-label">Durasi Sewa</span>
<div class="date-row">
<div class="date-field">
<span>tanggal mulai</span>
<input type="date">
</div>

<div class="date-field">
<span>tanggal selesai (maks 3 hari)</span>
<input type="date">
</div>
</div>
</div>
</div>
</div>
<div class="bottom-action">
<button class="btn-lanjut">Lanjut Ke Pembayaran</button>
</div>
</main>
<script src="sewa.js"></script>

</body>
<!-- DEKORASI BUDAYA -->
<div class="batik-stamp"></div>
<div class="wave-batik"></div>
</html>
