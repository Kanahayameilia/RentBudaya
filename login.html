<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RentBudaya – Masuk</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>

</head>
<body>
  <div class="bg"></div>

  <div class="card">
    <p class="brand">RentBudaya</p>
    <h1>Selamat Datang</h1>

    <form>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="masukkan email..." autocomplete="email"/>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="masukkan password..."/>
      </div>

      <div class="remember">
        <input type="checkbox" id="remember"/>
        <label for="remember">Simpan Password</label>
      </div>

      <button type="submit" class="btn-masuk">Masuk</button>
    </form>

    <p class="footer-link">Belum punya akun? <a href="#">Daftar</a></p>
  </div>
</body>
</html>
