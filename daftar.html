<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RentBudaya - Daftar</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css"> 
</head>

<body>

<div class="login-bg"></div>

<div class="card">
  <p class="brand">RentBudaya</p>
  <h1>Daftar Akun</h1>

  <form id="daftarForm">

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="masukkan email..." required>
    </div>

    <div class="field">
      <label>Buat Password</label>
      <input type="password" id="password" placeholder="buat password..." required>
    </div>

    <button type="submit" class="btn-masuk">Daftar</button>

  </form>

  <p class="footer">
    Sudah punya akun? <a href="login.html">Masuk</a>
  </p>
</div>

<script src="daftar.js"></script>
</body>
</html>
