<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Penjual - RentBudaya</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #E7D2BD;
}
.login-card {
    background: #F8F1EB;
    width: 100%;
    max-width: 420px;
    padding: 50px 45px;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    text-align: center;
}
.brand {
    font-size: 13px;
    font-weight: 600;
    color: #8c7b70;
    margin-bottom: 10px;
}
.login-card h1 {
    font-size: 28px;
    font-weight: 600;
    color: #C2764F;
    margin-bottom: 30px;
}
.field {
    text-align: left;
    margin-bottom: 18px;
}
.field label {
    font-size: 13px;
    font-weight: 600;
    color: #6f6258;
    margin-bottom: 6px;
    display: block;
}
.field input {
    width: 100%;
    padding: 12px 15px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 14px;
}
.btn-login {
    background: #C2764F;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 8px;
    width: 100%;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
}
.btn-login:hover { background: #a85f3b; }
.footer { margin-top: 20px; font-size: 14px; }
.footer a { color: #C2764F; text-decoration: none; }
.error { color: #d64545; font-size: 12px; margin-top: 5px; display: block; }
</style>
</head>
<body>
<div class="login-card">
    <p class="brand">RentBudaya</p>
    <h1>Login Penjual</h1>
    <form id="loginPenjualForm">
        <div class="field">
            <label>Email</label>
            <input type="email" id="email" required>
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" id="password" required>
        </div>
        <div id="errorMsg" class="error"></div>
        <button type="submit" class="btn-login">Masuk sebagai Penjual</button>
    </form>
    <p class="footer"><a href="login.html">← Kembali ke Login Customer</a></p>
</div>
<script src="login_penjual.js"></script>
</body>
</html>
