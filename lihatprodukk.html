<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Lihat Produk</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lihatprodukk.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">RB</div>
    <button class="nav-btn">Lihat Produk</button>
  </header>

  <main class="container">

    <p class="back">&lt; Kembali</p>

    <!-- CARD TOKO -->
    <div class="store-card">
      <h2>Toko Adat Jaya</h2>
      <p>Penyewaan baju dan aksesoris adat lengkap</p>
    </div>

    <h3 class="section-title">Produk tersedia</h3>

    <!-- PRODUK -->
    <div class="product-grid">

      <div class="product-card">
        <div class="product-image"></div>
        <div class="product-info">
          <p class="product-name">Kebaya Beskap Jawa</p>
          <div class="bottom">
            <div class="price">
              Rp 41.000
              <span>per hari</span>
            </div>
            <button class="sewa">Sewa</button>
          </div>
        </div>
      </div>

      <div class="product-card">
        <div class="product-image"></div>
        <div class="product-info">
          <p class="product-name">Kebaya Beskap Solo</p>
          <div class="bottom">
            <div class="price">
              Rp 91.000
              <span>per hari</span>
            </div>
            <button class="sewa">Sewa</button>
          </div>
        </div>
      </div>

    </div>

  </main>

</body>
</html>
